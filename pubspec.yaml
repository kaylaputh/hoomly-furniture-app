name: hoomly
description: Aplikasi Marketplace Furniture Mobile - Hoomly (Flutter + Firebase)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.14.0
  cloud_firestore: ^4.13.0
  firebase_storage: ^11.5.0
  
  # State Management
  riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0
  flutter_riverpod: ^2.4.0
  
  # UI & Design
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.1.0
  image_picker: ^1.0.0
  permission_handler: ^11.4.0
  
  # Navigation & Routing
  go_router: ^11.0.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  email_validator: ^2.1.0
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  
  # Alerts & Notifications
  awesome_dialog: ^3.1.0
  flutter_local_notifications: ^16.1.0
  
  # QR & Barcode
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
